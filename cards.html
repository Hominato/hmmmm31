<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards — Wells Fargo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div id="navbar-slot"></div>

    <div class="main-layout">
      <div id="sidebar-slot"></div>

      <main class="content-area">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Card Management</h1>
            <p class="page-subtitle">Instant freeze controls, spending limits, CVV preview, and card replacement.</p>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap:2rem;" id="cards-grid-container">
          <!-- Rendered dynamically by js/cards.js -->
        </div>
      </main>
    </div>

    <div id="mobile-nav-slot"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cards.js"></script>
</body>
</html>
