<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Money — Wells Fargo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div id="navbar-slot"></div>

    <div class="main-layout">
      <div id="sidebar-slot"></div>

      <main class="content-area">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Transfer Money</h1>
            <p class="page-subtitle">Move funds between internal accounts or send to saved beneficiaries.</p>
          </div>
          <button class="btn btn-outline btn-sm" id="add-beneficiary-btn">+ Add Beneficiary</button>
        </div>

        <div style="max-width:680px; margin:0 auto;">
          <div class="card" style="padding:2rem;">
            <form id="transfer-form">
              <div class="form-group">
                <label class="form-label" for="transfer-from">Transfer From</label>
                <select id="transfer-from" class="form-control form-select" required>
                  <!-- Rendered dynamically -->
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="transfer-to">Transfer To</label>
                <select id="transfer-to" class="form-control form-select" required>
                  <!-- Rendered dynamically -->
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="transfer-amount">Amount ($)</label>
                <input type="number" step="0.01" min="0.01" id="transfer-amount" class="form-control" placeholder="0.00" required style="font-size:1.5rem; font-weight:700; color:var(--accent);">
              </div>

              <div class="form-group">
                <label class="form-label" for="transfer-date">Transfer Date</label>
                <select id="transfer-date" class="form-control form-select">
                  <option value="Today">Today (Immediate)</option>
                  <option value="Scheduled">Scheduled for Next Business Day</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="transfer-memo">Memo / Note (Optional)</label>
                <input type="text" id="transfer-memo" class="form-control" placeholder="e.g. Monthly savings contribution">
              </div>

              <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1rem;">
                Review Transfer Details →
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <div id="mobile-nav-slot"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/transfers.js"></script>
</body>
</html>
