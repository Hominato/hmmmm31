<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Pay — Wells Fargo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div id="navbar-slot"></div>

    <div class="main-layout">
      <div id="sidebar-slot"></div>

      <main class="content-area">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Bill Pay System</h1>
            <p class="page-subtitle">Manage monthly utility, internet, and credit bill payments.</p>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <a href="bill-pay.html" class="btn btn-primary btn-sm">Pay Custom Bill</a>
            <button class="btn btn-outline btn-sm" id="add-biller-btn">+ Add Biller</button>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="banking-table">
              <thead>
                <tr>
                  <th>Biller</th>
                  <th>Due Date</th>
                  <th>Amount Due</th>
                  <th>Status</th>
                  <th>AutoPay</th>
                  <th style="text-align:right;">Action</th>
                </tr>
              </thead>
              <tbody id="bills-table-tbody">
                <!-- Rendered dynamically by js/bills.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <div id="mobile-nav-slot"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/bills.js"></script>
</body>
</html>
