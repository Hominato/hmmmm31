<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Wells Fargo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="public-page" style="display:flex; flex-direction:column; min-height:100vh; background-color:var(--bg-secondary);">

  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding: 2rem 1rem;">
    <div class="card" style="width:100%; max-width:440px; padding:2.5rem; box-shadow:var(--shadow-xl);">
      <div style="text-align:center; margin-bottom:2rem;">
        <a href="index.html" class="nav-brand" style="justify-content:center; margin-bottom:0.75rem;">
          <div class="brand-icon">WF</div>
          <span>Wells Fargo</span>
        </a>
        <h1 style="font-size:1.5rem; font-weight:800;">Reset Password</h1>
        <p style="color:var(--text-secondary); font-size:0.875rem; margin-top:0.25rem;">Enter your email to receive a password reset link</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reset-email" class="form-control" required value="meechiedemetrius333@gmail.com">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1rem;">Send Reset Link</button>
      </form>

      <div style="text-align:center; margin-top:1.75rem; font-size:0.875rem; color:var(--text-secondary);">
        Remembered your password? <a href="login.html" style="font-weight:700;">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', (e) => {
      e.preventDefault();
      UIModule.showToast('✓ Password reset instructions sent to your email!', 'success', 5000);
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    });
  </script>
</body>
</html>
