<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Wells Fargo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div id="navbar-slot"></div>

    <div class="main-layout">
      <div id="sidebar-slot"></div>

      <main class="content-area">
        <div class="page-header">
          <div class="page-title-group">
            <h1>User Profile</h1>
            <p class="page-subtitle">View and edit your personal contact details.</p>
          </div>
        </div>

        <div style="max-width:640px; margin:0 auto;">
          <div class="card" style="padding:2rem;">
            <form id="profile-form">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="profile-name" class="form-control" required>
              </div>

              <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="profile-email" class="form-control" required>
              </div>

              <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="profile-phone" class="form-control" required>
              </div>

              <div class="form-group">
                <label class="form-label">Mailing Address</label>
                <input type="text" id="profile-address" class="form-control" required>
              </div>

              <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1rem;">Save Profile Changes</button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <div id="mobile-nav-slot"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
