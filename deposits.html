<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Deposit — Wells Fargo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div id="navbar-slot"></div>

    <div class="main-layout">
      <div id="sidebar-slot"></div>

      <main class="content-area">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Mobile Check Deposit</h1>
            <p class="page-subtitle">Deposit checks remotely by uploading images of the front and back of your check.</p>
          </div>
        </div>

        <div style="max-width:680px; margin:0 auto;">
          <div class="card" style="padding:2rem;">
            <div style="background:var(--primary-light); border:1px solid var(--accent); border-radius:var(--radius-md); padding:1rem; margin-bottom:1.5rem; font-size:0.875rem; color:var(--text-primary);">
              <strong>📷 Instructions:</strong> Upload clear images of the front and endorsed back of your check.
            </div>

            <form id="deposit-form">
              <div class="form-group">
                <label class="form-label">Deposit To Account</label>
                <select id="deposit-account" class="form-control form-select" required>
                  <!-- Populated dynamically -->
                </select>
              </div>

              <div class="form-group">
                <label class="form-label">Check Amount ($)</label>
                <input type="number" step="0.01" min="0.01" id="deposit-amount" class="form-control" placeholder="750.00" required style="font-size:1.5rem; font-weight:700; color:var(--accent);">
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.5rem;">
                <!-- Front Image Dropzone -->
                <div>
                  <label class="form-label">Front of Check</label>
                  <label for="check-front-input" class="dropzone" id="front-dropzone">
                    <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom:0.5rem; color:var(--accent);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <div style="font-size:0.8rem; font-weight:600;">Upload Front Image</div>
                    <input type="file" id="check-front-input" accept="image/*" style="display:none;" required>
                    <img id="front-preview-img" class="dropzone-preview" style="display:none;" alt="Check Front Preview">
                  </label>
                </div>

                <!-- Back Image Dropzone -->
                <div>
                  <label class="form-label">Back of Check</label>
                  <label for="check-back-input" class="dropzone" id="back-dropzone">
                    <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom:0.5rem; color:var(--accent);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <div style="font-size:0.8rem; font-weight:600;">Upload Back Image</div>
                    <input type="file" id="check-back-input" accept="image/*" style="display:none;" required>
                    <img id="back-preview-img" class="dropzone-preview" style="display:none;" alt="Check Back Preview">
                  </label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Submit Deposit</button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <div id="mobile-nav-slot"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/deposits.js"></script>
</body>
</html>
