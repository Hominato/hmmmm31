<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Wells Fargo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div id="navbar-slot"></div>

    <div class="main-layout">
      <div id="sidebar-slot"></div>

      <main class="content-area">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Notification Center</h1>
            <p class="page-subtitle">View security alerts, deposit confirmations, and system notices.</p>
          </div>
          <button class="btn btn-outline btn-sm" id="clear-all-notifs-btn">Clear All</button>
        </div>

        <div style="max-width:720px; margin:0 auto;" id="notifications-list-container">
          <!-- Rendered dynamically by js/notifications.js -->
        </div>
      </main>
    </div>

    <div id="mobile-nav-slot"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
