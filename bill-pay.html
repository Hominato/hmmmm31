<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Bill — Wells Fargo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div id="navbar-slot"></div>

    <div class="main-layout">
      <div id="sidebar-slot"></div>

      <main class="content-area">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Make a Bill Payment</h1>
            <p class="page-subtitle">Select a biller and pay directly from your checking or savings account.</p>
          </div>
          <a href="bills.html" class="btn btn-secondary btn-sm">← Back to Bills</a>
        </div>

        <div style="max-width:600px; margin:0 auto;">
          <div class="card" style="padding:2rem;">
            <form id="custom-bill-form">
              <div class="form-group">
                <label class="form-label">Select Biller</label>
                <select id="custom-biller-select" class="form-control form-select" required>
                  <!-- Populated dynamically -->
                </select>
              </div>

              <div class="form-group">
                <label class="form-label">Pay From Account</label>
                <select id="custom-bill-account" class="form-control form-select" required>
                  <!-- Populated dynamically -->
                </select>
              </div>

              <div class="form-group">
                <label class="form-label">Payment Amount ($)</label>
                <input type="number" step="0.01" min="0.01" id="custom-bill-amount" class="form-control" placeholder="0.00" required style="font-size:1.5rem; font-weight:700; color:var(--accent);">
              </div>

              <div class="form-group">
                <label class="form-label">Payment Date</label>
                <input type="date" id="custom-bill-date" class="form-control" required>
              </div>

              <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:1rem;">Submit Bill Payment</button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <div id="mobile-nav-slot"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AuthModule.checkAuthentication();

      const billerSelect = document.getElementById('custom-biller-select');
      const accountSelect = document.getElementById('custom-bill-account');
      const amountInput = document.getElementById('custom-bill-amount');
      const dateInput = document.getElementById('custom-bill-date');

      const bills = DemoStorage.getBills();
      const accounts = DemoStorage.getAccounts();

      dateInput.value = new Date().toISOString().split('T')[0];

      billerSelect.innerHTML = bills.map(b => `
        <option value="${b.id}">${b.biller} (${UIModule.formatCurrency(b.amount)}) — Due ${b.dueDate}</option>
      `).join('');

      accountSelect.innerHTML = accounts.map(a => `
        <option value="${a.id}">${a.name} (${a.accountNumber}) — Avail: ${UIModule.formatCurrency(a.availableBalance)}</option>
      `).join('');

      // Auto-update amount when biller changes
      billerSelect.addEventListener('change', () => {
        const b = bills.find(item => item.id === billerSelect.value);
        if (b) amountInput.value = b.amount;
      });

      if (bills.length > 0) amountInput.value = bills[0].amount;

      document.getElementById('custom-bill-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const billId = billerSelect.value;
        const accountId = accountSelect.value;

        try {
          DemoStorage.payBill(billId, accountId);
          UIModule.showToast('✓ Bill payment submitted successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'bills.html';
          }, 1200);
        } catch (err) {
          UIModule.showToast(err.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
